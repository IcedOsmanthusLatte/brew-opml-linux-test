name: BrewOPML
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  BrewHarness:
    type: application
    platform: macOS
    sources: [Harness]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.getbrew.opmlharness
  BrewOPMLUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: BrewHarness
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.getbrew.opmlharness.uitests
      TEST_TARGET_NAME: BrewHarness
schemes:
  BrewOPML:
    build:
      targets:
        BrewHarness: all
        BrewOPMLUITests: [test]
    test:
      targets: [BrewOPMLUITests]
