name: Fluent Reader nested OPML validation
on:
  push:
    branches: [fluent-opml-nested-20261124]
    paths:
      - .github/workflows/fluent-opml-nested.yml
      - fluent-opml-nested/**
permissions:
  contents: read
jobs:
  native:
    name: Fluent Reader ${{ matrix.condition }} ${{ matrix.repeat }}
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        condition: [single, double]
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and hash-check official Fluent Reader
        shell: pwsh
        run: ./fluent-opml-nested/prepare.ps1
      - name: Install the Windows automation dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pywinauto==0.6.9 pillow==11.3.0
      - name: Import from the real app and restart the same fresh library
        run: >-
          python fluent-opml-nested/run_experiment.py
          --condition ${{ matrix.condition }}
          --repeat ${{ matrix.repeat }}
          --fixture fluent-opml-nested/${{ matrix.condition }}.opml
          --evidence fluent-opml-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fluent-opml-${{ matrix.condition }}-${{ matrix.repeat }}
          path: |
            fluent-opml-evidence/environment.json
            fluent-opml-evidence/trial.json
            fluent-opml-evidence/native-export.opml
          if-no-files-found: error
          retention-days: 14
