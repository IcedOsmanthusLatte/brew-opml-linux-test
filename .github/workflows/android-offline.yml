name: Android OPML offline first read
on:
  push:
    branches: [android-opml-offline-reading]
    paths:
      - .github/workflows/android-offline.yml
      - android-offline-runtime/**
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check Android and enable emulator acceleration
        shell: bash
        run: |
          if ! test -c /dev/kvm; then ls -ld /dev/kvm; exit 1; fi
          sudo chmod a+rw /dev/kvm
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if ! test -x "$sdk"; then sdk="$(command -v sdkmanager)"; fi
          if ! test -x "$ANDROID_HOME/emulator/emulator"; then "$sdk" "emulator" "platform-tools"; fi
          test -x "$ANDROID_HOME/emulator/emulator"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/emulator/emulator" -accel-check
          mkdir -p android-offline-evidence
      - name: Retrieve verified released Android apps
        shell: bash
        run: python android-offline-runtime/install.py
      - name: Boot Android and verify the disconnected network control
        shell: bash
        run: bash android-offline-runtime/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-offline-evidence
          path: android-offline-evidence/
          retention-days: 14
