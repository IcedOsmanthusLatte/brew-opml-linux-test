name: Vienna OPML destination folder pilot
on:
  push:
    branches: [vienna-opml-destination-pilot-20261124]
    paths:
      - mac-opml-runtime/**
      - .github/workflows/vienna-opml-destination-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        selection: [selected, unselected]
        trial: [1, 2]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      BREW_VIENNA_SELECTION: ${{ matrix.selection }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify official install and prepare OPML samples
        run: bash mac-opml-runtime/stage.sh vienna nested ${{ matrix.trial }}
      - name: Run native OPML workflow with Xcode UI tests
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          cd mac-opml-runtime
          xcodegen generate
          xcodebuild test -project BrewOPML.xcodeproj -scheme BrewOPML \
            -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/brew-opml-build" \
            -resultBundlePath "$RUNNER_TEMP/brew-opml.xcresult" \
            CODE_SIGN_IDENTITY=- | tee "$GITHUB_WORKSPACE/proof/xc-test.log"
      - name: Collect Xcode test attachments
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/brew-opml.xcresult"
          if [[ -d "$result" ]]; then
            dest="$RUNNER_TEMP/brew-opml-attachments"
            xcrun xcresulttool export attachments --path "$result" --output-path "$dest"
            python3 mac-opml-runtime/attachments.py "$dest" proof
          fi
      - name: Verify fixture URLs and export structure
        run: python3 mac-opml-runtime/evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vienna-opml-destination-${{ matrix.selection }}-${{ matrix.trial }}
          path: proof/
          retention-days: 14
